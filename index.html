<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Pusheen - Smart Monitoring 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --pink-main:   #ff65a3;
            --pink-light:  #ffbcca;
            --pink-soft:   #fff0f3;
            --purple-terminal: #3a1225;
            --text-dark:   #7d5267;
            --card-bg:     rgba(255, 255, 255, 0.95);
            --radius:      24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: url('https://i.pinimg.com/webp/1200x/b7/6d/5f/b76d5f2ffb21263b588c23618d97ee9a.webp') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            padding: 50px 20px;
            overflow-x: hidden;
        }

        .wrapper { max-width: 1200px; margin: 0 auto; position: relative; }

        .status-wrap {
            position: fixed; top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 8px; z-index: 1000;
        }
        .badge {
            background: white; padding: 8px 16px; border-radius: 30px;
            font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.05); border: 2px solid #e2e8f0; color: #94a3b8;
        }
        .badge.online { color: var(--pink-main); border-color: var(--pink-light); background: var(--pink-soft); }

        .header-container { text-align: center; margin-bottom: 40px; }
        .main-logo { max-width: 360px; height: auto; }

        .main-grid { display: grid; grid-template-columns: 460px 1fr; gap: 30px; }
        .left-pane { display: flex; flex-direction: column; gap: 30px; }
        .right-pane { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .full-width-cell { grid-column: span 2; }

        .card {
            background: var(--card-bg); border-radius: var(--radius); padding: 30px;
            box-shadow: 0 12px 24px rgba(125, 82, 103, 0.1); border: 4px solid white; position: relative;
        }

        .card-title-cute { font-family: 'Fredoka One', sans-serif; font-size: 1.4em; color: var(--pink-main); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        input {
            width: 100%; padding: 12px 16px; border: 3px solid var(--pink-light);
            border-radius: 20px; font-size: .95em; color: var(--text-dark); margin-bottom: 15px; font-weight: 700;
        }
        
        .btn-cute {
            background: var(--pink-main); color: white; border: none; padding: 14px 24px; border-radius: 30px;
            font-weight: 900; cursor: pointer; width: 100%; font-family: 'Fredoka One', sans-serif;
            box-shadow: 0 4px 0 #d93d7a; transition: .2s;
        }
        .btn-cute:active { transform: translateY(4px); box-shadow: none; }
        .btn-secondary { background: #b1859b; box-shadow: 0 4px 0 #855b71; }

        .suhu-display-container { text-align: center; margin: 15px 0; }
        .suhu-value { font-family: 'Fredoka One', sans-serif; font-size: 4.5em; color: #ff5252; line-height: 1; position: relative; display: inline-block; }
        .suhu-degree-symbol { font-size: 0.4em; position: absolute; top: 0; right: -25px; }
        .chart-mini-container { height: 80px; width: 100%; margin-top: 10px; }

        /* Switch UI */
        .switch-track-cute { width: 55px; height: 100px; background: #fff5a3; border-radius: 40px; position: relative; cursor: pointer; border: 4px solid white; }
        .switch-ball-cute { width: 37px; height: 37px; background: var(--pink-light); border-radius: 50%; position: absolute; left: 5px; transition: 0.3s; }
        .switch-track-cute.auto .switch-ball-cute { top: 5px; background: #ff65a3; }
        .switch-track-cute.manual .switch-ball-cute { top: 50px; background: #b5e2ff; }

        /* Terminal */
        .terminal-box { background: var(--purple-terminal); border-radius: var(--radius); padding: 20px; }
        .terminal-screen { height: 150px; overflow-y: auto; font-family: 'Space Mono', monospace; font-size: 11px; color: #ffbcca; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; }
    </style>
</head>
<body>

<div class="status-wrap">
    <div class="badge" id="status-bt"><i class="fab fa-bluetooth-b"></i> BT Offline</div>
    <div class="badge" id="status-fb"><i class="fas fa-cloud"></i> DB Offline</div>
</div>

<div class="wrapper">
    <div class="header-container">
        <img src="https://github.com/Navrad16/Latihan-Finpro/blob/main/Group%2013.png?raw=true" class="main-logo" alt="Logo">
    </div>

    <div class="main-grid">
        <div class="left-pane">
            <div class="card">
                <div class="card-title-cute"><i class="fas fa-microchip"></i> Connect Microbit</div>
                <button class="btn-cute" id="btn-connect-ble">Connect BLE</button>
                <button class="btn-cute btn-secondary" id="btn-disconnect-ble" disabled style="margin-top:10px;">Disconnect</button>
            </div>

            <div class="card">
                <div class="card-title-cute"><i class="fas fa-cloud"></i> Firebase Cloud</div>
                <input type="password" id="fb-apiKey" placeholder="API Key">
                <input type="text" id="fb-dbUrl" placeholder="Database URL">
                <input type="text" id="fb-path" value="smarthome/ruangan1">
                <button class="btn-cute" id="btn-connect-fb">Sync Firebase</button>
            </div>
        </div>

        <div class="right-pane">
            <div class="card full-width-cell">
                <div class="card-title-cute"><i class="fas fa-thermometer-half"></i> DHT11 SUHU</div>
                <div class="suhu-display-container">
                    <!-- PERBAIKAN: Pastikan class 'num' ada di sini -->
                    <div class="suhu-value" id="val-suhu"><span class="num">--</span><span class="suhu-degree-symbol">°</span></div>
                </div>
                <div class="chart-mini-container"><canvas id="chart-suhu-mini"></canvas></div>
            </div>

            <div class="card" id="btnToggleMode">
                <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
                    <div id="modeTxt" style="font-family:'Fredoka One'; font-size:1.2em;">Auto</div>
                    <div class="switch-track-cute auto" id="cuteSwitch"><div class="switch-ball-cute"></div></div>
                </div>
            </div>

            <div class="card">
                <div style="text-align:center;">
                    <div style="font-size:2em; color:#ffd15c;"><i class="fas fa-bolt"></i></div>
                    <div style="font-family:'Fredoka One';">Relay Kipas</div>
                    <div id="lbl-relay" style="font-size:1.5em; font-weight:bold;">Off</div>
                    <div id="manual-relay-wrap" style="display:none; margin-top:10px;">
                        <input type="checkbox" id="sw-relay" onchange="window.toggleRelay(this.checked)"> Manual Control
                    </div>
                </div>
            </div>

            <div class="card full-width-cell terminal-box">
                <div id="terminalLog" class="terminal-screen"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp, getApps, deleteApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, update, set } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const state = {
    db: null, path: "", device: null, txChar: null, rxChar: null,
    bleConnected: false, bleBuffer: "", modeOtomatis: 1,
    charts: {}, history: { suhu: { labels: [], data: [] } }
};

const $ = id => document.getElementById(id);

function log(msg, color = "#ffbcca") {
    const t = new Date().toLocaleTimeString();
    $('terminalLog').insertAdjacentHTML('afterbegin', `<div style="color:${color}">[${t}] ${msg}</div>`);
}

// PERBAIKAN: Fungsi update UI yang lebih konsisten
function updateSensorUI(val) {
    const elNum = document.querySelector('#val-suhu .num');
    if (elNum) {
        const n = parseFloat(val);
        elNum.textContent = isNaN(n) ? "--" : n.toFixed(1);
    }
}

function pushHistory(val) {
    const n = parseFloat(val);
    if (isNaN(n)) return;
    
    const h = state.history.suhu;
    h.labels.push(new Date().toLocaleTimeString());
    h.data.push(n);
    if (h.labels.length > 20) { h.labels.shift(); h.data.shift(); }

    if (state.charts['chart-suhu-mini']) {
        state.charts['chart-suhu-mini'].update('none');
    }
}

function applyMode(isAuto) {
    state.modeOtomatis = isAuto ? 1 : 0;
    $('cuteSwitch').className = isAuto ? "switch-track-cute auto" : "switch-track-cute manual";
    $('modeTxt').textContent = isAuto ? "Auto" : "Manual";
    $('manual-relay-wrap').style.display = isAuto ? 'none' : 'block';
}

// FIREBASE LOGIC
async function connectFirebase() {
    const apiKey = $('fb-apiKey').value.trim();
    const dbUrl = $('fb-dbUrl').value.trim();
    const path = $('fb-path').value.trim();

    try {
        const app = initializeApp({ apiKey, databaseURL: dbUrl });
        state.db = getDatabase(app);
        state.path = path;
        
        onValue(ref(state.db, path), (snap) => {
            const data = snap.val();
            if (!data) return;
            
            // PERBAIKAN: Pastikan UI angka besar terupdate saat Firebase berubah
            if (data.suhu) {
                updateSensorUI(data.suhu.value);
                pushHistory(data.suhu.value);
            }
            if (data.relay) {
                $('lbl-relay').textContent = data.relay.value === 1 ? "On" : "Off";
                $('lbl-relay').style.color = data.relay.value === 1 ? "#ff65a3" : "#94a3b8";
            }
            if (data.mode) applyMode(data.mode.value === 1);
            
            $('status-fb').className = "badge online";
            $('status-fb').innerHTML = '<i class="fas fa-cloud"></i> DB Synced';
        });
        log("Firebase Connected!", "#27c93f");
    } catch (e) { log("Firebase Error: " + e.message, "#ff5252"); }
}

// BLUETOOTH LOGIC
const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

async function connectBLE() {
    try {
        state.device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC micro:bit" }],
            optionalServices: [SVC]
        });
        const server = await state.device.gatt.connect();
        const service = await server.getPrimaryService(SVC);
        state.txChar = await service.getCharacteristic(TX);
        state.rxChar = await service.getCharacteristic(RX);
        
        await state.txChar.startNotifications();
        state.txChar.addEventListener('characteristicvaluechanged', (e) => {
            let str = new TextDecoder().decode(e.target.value);
            state.bleBuffer += str;
            if (state.bleBuffer.includes('\n')) {
                let parts = state.bleBuffer.trim().split(/[: ,]+/);
                if (parts.length >= 2) {
                    let key = parts[0].toLowerCase();
                    let val = parseFloat(parts[1]);
                    if (key === "suhu" || key === "t") {
                        updateSensorUI(val);
                        pushHistory(val);
                        if (state.db) update(ref(state.db, `${state.path}/suhu`), { value: val });
                    }
                }
                state.bleBuffer = "";
            }
        });
        
        state.bleConnected = true;
        $('status-bt').className = "badge online";
        $('status-bt').innerHTML = '<i class="fab fa-bluetooth-b"></i> BT Connected';
        $('btn-disconnect-ble').disabled = false;
        log("BLE Connected!", "#27c93f");
    } catch (e) { log("BLE Error: " + e.message, "#ff5252"); }
}

// INITIALIZATION
window.onload = () => {
    const ctx = $('chart-suhu-mini').getContext('2d');
    state.charts['chart-suhu-mini'] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: state.history.suhu.labels,
            datasets: [{ data: state.history.suhu.data, borderColor: '#ff65a3', tension: 0.4, fill: true, backgroundColor: 'rgba(255,101,163,0.1)' }]
        },
        options: { scales: { x: { display: false }, y: { beginAtZero: false } }, plugins: { legend: { display: false } } }
    });
};

$('btn-connect-fb').onclick = connectFirebase;
$('btn-connect-ble').onclick = connectBLE;
$('btnToggleMode').onclick = () => applyMode(state.modeOtomatis === 0);
</script>
</body>
</html>
