<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Pusheen - Smart Monitoring 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --pink-main:   #ff65a3;
            --pink-light:  #ffbcca;
            --pink-soft:   #fff0f3;
            --purple-terminal: #3a1225;
            --text-dark:   #7d5267;
            --card-bg:     rgba(255, 255, 255, 0.95);
            --radius:      24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: url('https://i.pinimg.com/webp/1200x/b7/6d/5f/b76d5f2ffb21263b588c23618d97ee9a.webp') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            padding: 50px 20px;
            overflow-x: hidden;
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== DECORATIVE STARS BACKGROUND ===== */
        .decor-star { position: absolute; pointer-events: none; z-index: 1; width: 35px; }
        .star-top-left-1 { top: -30px; left: 12%; }
        .star-top-left-2 { top: 10px; left: 24%; width: 25px; }

        /* ===== STATUS BADGES ===== */
        .status-wrap {
            position: fixed; top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 8px; z-index: 1000;
        }
        .badge {
            background: white; padding: 8px 16px; border-radius: 30px;
            font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.05); border: 2px solid #e2e8f0; color: #94a3b8;
        }
        .badge.online { color: var(--pink-main); border-color: var(--pink-light); background: var(--pink-soft); }

        /* ===== UI TOP HEADER ===== */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        .main-logo {
            max-width: 360px;
            height: auto;
            display: inline-block;
        }

        /* ===== LAYOUT GRID ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 460px 1fr;
            gap: 30px;
            align-items: start;
        }

        .left-pane {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .right-pane {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .full-width-cell {
            grid-column: span 2;
        }

        /* ===== CARD ARCHITECTURE ===== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
