<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Pusheen - Smart Monitoring 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --pink-main:   #ff65a3;
            --pink-light:  #ffbcca;
            --pink-soft:   #fff0f3;
            --purple-terminal: #3a1225;
            --text-dark:   #7d5267;
            --card-bg:     rgba(255, 255, 255, 0.95);
            --radius:      24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: url('https://i.pinimg.com/webp/1200x/b7/6d/5f/b76d5f2ffb21263b588c23618d97ee9a.webp') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            padding: 50px 20px;
            overflow-x: hidden;
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== DECORATIVE STARS BACKGROUND ===== */
        .decor-star { position: absolute; pointer-events: none; z-index: 1; width: 35px; }
        .star-top-left-1 { top: -30px; left: 12%; }
        .star-top-left-2 { top: 10px; left: 24%; width: 25px; }

        /* ===== STATUS BADGES ===== */
        .status-wrap {
            position: fixed; top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 8px; z-index: 1000;
        }
        .badge {
            background: white; padding: 8px 16px; border-radius: 30px;
            font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.05); border: 2px solid #e2e8f0; color: #94a3b8;
        }
        .badge.online { color: var(--pink-main); border-color: var(--pink-light); background: var(--pink-soft); }

        /* ===== UI TOP HEADER ===== */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        .main-logo {
            max-width: 360px;
            height: auto;
            display: inline-block;
        }

        /* ===== LAYOUT GRID (MATCHING IMAGE POSITION) ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 460px 1fr;
            gap: 30px;
            align-items: start;
        }

        .left-pane {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .right-pane {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .full-width-cell {
            grid-column: span 2;
        }

        /* ===== CARD ARCHITECTURE ===== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 12px 24px rgba(125, 82, 103, 0.1);
            border: 4px solid white;
            position: relative;
        }

        .card-title-cute {
            font-family: 'Fredoka One', sans-serif;
            font-size: 1.4em;
            color: var(--pink-main);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== FORMS, INPUTS & CUTE BUTTONS ===== */
        label { 
            display: block; font-weight: 800; font-size: .85em; 
            color: var(--pink-main); margin-bottom: 6px; text-transform: capitalize; 
        }
        input {
            width: 100%; padding: 12px 16px; border: 3px solid var(--pink-light);
            border-radius: 20px; font-size: .95em; color: var(--text-dark);
            background: white; outline: none; transition: all .3s; font-weight: 700; margin-bottom: 15px;
        }
        input:focus { border-color: var(--pink-main); }
        
        .btn-cute {
            background: var(--pink-main); color: white; border: none;
            padding: 14px 24px; border-radius: 30px; font-weight: 900; font-size: 1em;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            gap: 10px; transition: all .25s; width: 100%;
            font-family: 'Fredoka One', sans-serif;
            box-shadow: 0 4px 0 #d93d7a;
        }
        .btn-cute:active { transform: translateY(4px); box-shadow: none; }
        .btn-cute:disabled { background: #cbd5e1; box-shadow: 0 4px 0 #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #b1859b; box-shadow: 0 4px 0 #855b71; }

        /* ===== INDIVIDUAL CARD SPECIFICS ===== */
        /* Microbit Card */
        .microbit-card p {
            font-size: 0.85em; color: #a17b8e; line-height: 1.6; margin-bottom: 20px; font-weight: 600;
        }

        /* DHT11 Suhu Card */
        .suhu-display-container {
            text-align: center;
            margin: 15px 0;
            position: relative;
        }
        .suhu-value {
            font-family: 'Fredoka One', sans-serif;
            font-size: 4.5em;
            color: #ff5252;
            line-height: 1;
            display: inline-block;
            position: relative;
            letter-spacing: -2px;
        }
        .suhu-degree-symbol { font-size: 0.4em; position: absolute; top: 0; right: -25px; }
        .suhu-subtitle { text-align: center; font-weight: 700; color: #a3728a; font-size: 0.9em; margin-bottom: 10px; }
        .chart-mini-container { height: 70px; width: 100%; margin-top: 10px; }

        /* Toggle Auto/Manual Card */
        .mode-swap-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 100%;
        }
        .mode-text { font-family: 'Fredoka One', sans-serif; font-size: 1.4em; color: var(--pink-main); }
        .mode-text.manual-lbl { color: #ffe66d; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
        
        .switch-track-cute {
            width: 55px; height: 100px; background: #fff5a3; border-radius: 40px;
            position: relative; cursor: pointer; border: 4px solid white;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.05);
        }
        .switch-ball-cute {
            width: 37px; height: 37px; background: var(--pink-light); border-radius: 50%;
            position: absolute; left: 5px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .switch-track-cute.auto .switch-ball-cute { top: 5px; background: #ff65a3; }
        .switch-track-cute.manual .switch-ball-cute { top: 50px; background: #b5e2ff; }

        /* Relay Card */
        .relay-wrapper {
            text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;
        }
        .relay-bolt { font-size: 3.5em; color: #ffd15c; margin-bottom: 5px; animation: bounce 3s infinite; }
        .relay-title-text { font-family: 'Fredoka One', sans-serif; font-size: 1.4em; color: #e07a5f; margin-bottom: 4px; }
        .relay-meta { font-size: 0.78em; color: #a3728a; font-weight: 600; line-height: 1.4; margin-bottom: 10px; padding: 0 10px; }
        .relay-state-output { font-family: 'Fredoka One', sans-serif; font-size: 2em; color: #94a3b8; text-transform: capitalize; }
        .relay-state-output.on { color: var(--pink-main); }

        /* Slide switch untuk manual mode control */
        .manual-toggle-element { position: relative; display: inline-block; width: 50px; height: 26px; margin-top: 5px; }
        .manual-toggle-element input { opacity: 0; width: 0; height: 0; }
        .slider-round {
            position: absolute; cursor: pointer; inset: 0; background-color: #cbd5e1; transition: .3s; border-radius: 34px;
        }
        .slider-round:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider-round { background-color: var(--pink-main); }
        input:checked + .slider-round:before { transform: translateX(24px); }

        /* System Terminal Card */
        .terminal-box {
            background: var(--purple-terminal); border-radius: var(--radius); padding: 25px; border: 4px solid #542239;
        }
        .terminal-header-pane { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .terminal-header-title { color: var(--pink-light); font-family: 'Space Mono', monospace; font-size: .85em; display: flex; align-items: center; gap: 8px; }
        .terminal-dots-wrap { display: flex; gap: 6px; }
        .t-dot { width: 10px; height: 10px; border-radius: 50%; }
        .t-dot.red { background: #ff5f56; } .t-dot.yellow { background: #ffbd2e; } .t-dot.green { background: #27c93f; }
        
        .terminal-screen {
            height: 160px; overflow-y: auto; font-family: 'Space Mono', monospace;
            background: rgba(0,0,0,0.2); border-radius: 14px; padding: 15px; font-size: 11px; color: #ffbcca;
        }
        .terminal-screen::-webkit-scrollbar { width: 5px; }
        .terminal-screen::-webkit-scrollbar-thumb { background: var(--pink-main); border-radius: 4px; }
        .log-row { margin-bottom: 4px; line-height: 1.4; }
        .log-timestamp { color: var(--pink-main); opacity: .7; margin-right: 6px; }

        /* ===== ABSOLUTE PLACED PUSHEEN CHARACTERS ===== */
        .pusheen-img { position: absolute; pointer-events: none; z-index: 5; }
        .pusheen-reader  { bottom: -5px; right: -75px; width: 90px; } /* Dekat Microbit */
        .pusheen-unicorn { bottom: -45px; left: -35px; width: 115px; } /* Pojok kiri Firebase */
        .pusheen-sitting { bottom: 25px; right: -55px; width: 95px; }  /* Samping Suhu */
        .pusheen-angel   { bottom: -45px; left: -30px; width: 105px; } /* Pojok kiri Terminal */

        /* ===== RESPONSIVE MEDIA QUERIES ===== */
        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; }
            .pusheen-img { display: none; }
        }
    </style>
</head>
<body>

<img src="https://github.com/Navrad16/Latihan-Finpro/blob/main/Star%202.png?raw=true" class="decor-star star-top-left-1" alt="star decoration">
<img src="https://github.com/Navrad16/Latihan-Finpro/blob/main/Star%202.png?raw=true" class="decor-star star-top-left-2" alt="star decoration">

<div class="status-wrap">
    <div class="badge" id="status-bt"><i class="fab fa-bluetooth-b"></i> BT Offline</div>
    <div class="badge" id="status-fb"><i class="fas fa-cloud"></i> DB Offline</div>
</div>

<div class="wrapper">

    <div class="header-container">
        <img src="https://github.com/Navrad16/Latihan-Finpro/blob/main/Group%2013.png?raw=true" class="main-logo" alt="My Little Pusheen Dashboard Header">
    </div>

    <div class="main-grid">
        
        <div class="left-pane">
            
            <div class="card microbit-card">
                <div class="card-title-cute" style="color: #fda4af;"><i class="fas fa-microchip"></i> Connect Microbit</div>
                <p>Pastikan Micro:bit menyala dan ekstensi <span style="color: var(--pink-main); font-weight:700;">Bluetooth UART</span> aktif di MakeCode.</p>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button class="btn-cute" id="btn-connect-ble">
                        <i class="fab fa-bluetooth"></i> Connect Micro:Bit
                    </button>
                    <button class="btn-cute btn-secondary" id="btn-disconnect-ble" disabled>
                        <i class="fas fa-times"></i> Disconnect
                    </button>
                </div>
                <img src="https://github.com/Navrad16/Latihan-Finpro/blob/main/Group%204.png?raw=true" class="pusheen-img pusheen-reader" alt="pusheen reading">
            </div>

            <div class="card">
                <div class="card-title-cute"><i class="fas fa-cloud"></i> Fire base cloud sync</div>
                
                <label for="fb-apiKey">Api key</label>
                <input type="password" id="fb-apiKey">
                
                <label for="fb-dbUrl">Database URL</label>
                <input type="text" id="fb-dbUrl">
                
                <label for="fb-path">Node path</label>
                <input type="text" id="fb-path" value="smarthome/ruangan1">
                
                <button class="btn-cute" id="btn-connect-fb" style="margin-top: 5px;">
                    <i class="fas fa-link"></i> Hubungkan Firebase
                </button>
                
                <img src="https://github.com/Navrad16/Latihan-Finpro/blob/main/Vector%203.png?raw=true" class="pusheen-img pusheen-unicorn" alt="pusheen pegacorn">
            </div>

        </div>

        <div class="right-pane">
            
            <div class="card full-width-cell">
                <div class="card-title-cute" style="color: #ff65a3;"><i class="fas fa-thermometer-half"></i> DHT11 - SUHU</div>
                <div class="suhu-display-container">
                    <div class="suhu-value" id="val-suhu">--<span class="suhu-degree-symbol">°</span></div>
                </div>
                <div class="suhu-subtitle">Suhu udara taman</div>
                
                <div class="chart-mini-container"><canvas id="chart-suhu-mini"></canvas></div>

                <img src="https://github.com/Navrad16/Latihan-Finpro/blob/main/Group%205.png?raw=true" class="pusheen-img pusheen-sitting" alt="pusheen eating snack">
            </div>

            <div class="card" id="btnToggleMode" style="cursor: pointer;">
                <div class="mode-swap-wrapper">
                    <div class="mode-text" id="modeTxt">Auto</div>
                    <div class="switch-track-cute auto" id="cuteSwitch">
                        <div class="switch-ball-cute"></div>
                    </div>
                    <div class="mode-text manual-lbl" id="modeTxtSub">Manual</div>
                </div>
            </div>

            <div class="card">
                <div class="relay-wrapper">
                    <div class="relay-bolt"><i class="fas fa-bolt"></i></div>
                    <div class="relay-title-text">Relay</div>
                    <div class="relay-meta">📌 pin P13 . Untuk mengontrol nyala dan matinya kipas</div>
                    <div class="relay-state-output" id="lbl-relay">Off</div>
                    
                    <div id="manual-relay-wrap" style="display: none; margin-top: 5px;">
                        <label class="manual-toggle-element">
                            <input type="checkbox" id="sw-relay" onchange="window.toggleRelay(this.checked)">
                            <span class="slider-round"></span>
                        </label>

            <div class="card full-width-cell terminal-box">
                <div class="terminal-header-pane">
                    <div class="terminal-header-title">
                        <div class="terminal-dots-wrap">
                            <div class="t-dot red"></div><div class="t-dot yellow"></div><div class="t-dot green"></div>
                        </div>
                        <span>System_terminal</span>
                    </div>
                    <button class="btn-cute btn-secondary" id="btnClearLog" style="padding: 4px 12px; font-size: 0.7em; width: auto; font-family: monospace; border-radius: 8px; box-shadow: 0 2px 0 #542239;">
                        Clear
                    </button>
                </div>
                <div id="terminalLog" class="terminal-screen"></div>
                
                <img src="https://github.com/Navrad16/Latihan-Finpro/blob/main/Vector%206.png?raw=true" class="pusheen-img pusheen-angel" alt="pusheen angel wings">

<script type="module">
import { initializeApp, getApps, deleteApp }     from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, update, set } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

// Application State Management
const state = {
    db: null, path: "", unsub: null, data: {},
    device: null, txChar: null, rxChar: null,
    bleConnected: false, bleBuffer: "",
    modeOtomatis: 1,   // Default State: 1 = Automatic, 0 = Manual Operation Mode
    charts: {},
    history: {
        suhu: { labels: [], data: [] }
    }
};

const MAX_PTS = 20; // Batasan jumlah memori titik data grafik
const $ = id => document.getElementById(id); // Shortcut handler DOM element selection

// Logging Framework System Console Terminal
function log(msg, color = "#ffbcca") {
    const t = new Date().toLocaleTimeString('id-ID', { hour12: false });
    $('terminalLog').insertAdjacentHTML('afterbegin',
        `<div class="log-row"><span class="log-timestamp">[${t}]</span><span style="color:${color}"> ${msg}</span></div>`);
}

// Network Link Status Visual Management
function updateBTStatus() {
    $('btn-connect-ble').disabled    = state.bleConnected;
    $('btn-disconnect-ble').disabled = !state.bleConnected;
    const b = $('status-bt');
    b.innerHTML = state.bleConnected ? '<i class="fab fa-bluetooth-b"></i> BT Connected' : '<i class="fab fa-bluetooth-b"></i> BT Offline';
    b.className = 'badge' + (state.bleConnected ? ' online' : '');
}
function updateDBStatus(ok) {
    const b = $('status-fb');
    b.innerHTML = ok ? '<i class="fas fa-cloud"></i> DB Synced' : '<i class="fas fa-cloud"></i> DB Offline';
    b.className = 'badge' + (ok ? ' online' : '');
}

// System Operation Mode Handler (Auto Control/Manual Trigger Handler Swap)
function applyMode(isAuto) {
    state.modeOtomatis = isAuto ? 1 : 0;
    const switchBtn = $('cuteSwitch');
    const txtMain = $('modeTxt');
    const txtSub = $('modeTxtSub');

    if (isAuto) {
        switchBtn.className = "switch-track-cute auto";
        txtMain.style.color = "var(--pink-main)";
        txtSub.style.color = "#cbd5e1";
        $('manual-relay-wrap').style.display = 'none';
    } else {
        switchBtn.className = "switch-track-cute manual";
        txtMain.style.color = "#cbd5e1";
        txtSub.style.color = "#e07a5f";
        $('manual-relay-wrap').style.display = 'block';
    }

    sendBLE("mode", isAuto ? 1 : 0);
    if (state.db) update(ref(state.db, `${state.path}/mode`), { value: isAuto ? 1 : 0 });
    log(`Mode sistem diubah → ${isAuto ? 'AUTO' : 'MANUAL'}`, isAuto ? '#ff65a3' : '#ffd15c');
}

$('btnToggleMode').onclick = () => applyMode(state.modeOtomatis === 0);

// Actuator Status (Relay Control Node Handler)
function updateRelayUI(isOn) {
    const lbl = $('lbl-relay');
    const sw = $('sw-relay');
    if (isOn) {
        lbl.textContent = "On";
        lbl.className = "relay-state-output on";
    } else {
        lbl.textContent = "Off";
        lbl.className = "relay-state-output";
    }
    if (sw && document.activeElement !== sw) sw.checked = isOn;
}

// DHT11 Sensor Data Processor Update Interface
function updateSensorUI(val) {
    const el = $('val-suhu');
    if (!el) return;
    el.innerHTML = `${val}<span class="suhu-degree-symbol">°</span>`;
}

// Web Bluetooth API Logic Integration
const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

async function connectBLE() {
    try {
        if (!navigator.bluetooth) throw new Error("Browser ini tidak mendukung fitur Web Bluetooth.");
        log("Mencari perangkat Micro:bit...", "#ffd15c");
        state.device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC micro:bit" }],
            optionalServices: [SVC]
        });
        state.device.addEventListener("gattserverdisconnected", () => {
            state.bleConnected = false; updateBTStatus();
            log("Koneksi Bluetooth Terputus!", "#ff5252");
        });
        const server  = await state.device.gatt.connect();
        const service = await server.getPrimaryService(SVC);
        state.txChar  = await service.getCharacteristic(TX);
        state.rxChar  = await service.getCharacteristic(RX);
        await state.txChar.startNotifications();
        state.txChar.addEventListener("characteristicvaluechanged", onBLEData);
        state.bleConnected = true; updateBTStatus();
        log(`✓ Sukses Terhubung Ke: ${state.device.name}`, "#ff65a3");
    } catch (e) { log(`Error BLE: ${e.message}`, "#ff5252"); }
}

function onBLEData(event) {
    let arr = [];
    for (let i = 0; i < event.target.value.byteLength; i++)
        arr.push(event.target.value.getUint8(i));
    state.bleBuffer += String.fromCharCode.apply(null, arr);
    const lines = state.bleBuffer.split('\n');
    state.bleBuffer = lines.pop() || "";
    lines.forEach(line => { const t = line.trim(); if (t) processBLELine(t); });
}

// Memproses baris data UART masuk dari microbit hardware
function processBLELine(txt) {
    log(`RX ← ${txt}`, "#ffbcca");
    if (!txt.includes(',')) return;

    const idx = txt.indexOf(',');
    const key = txt.substring(0, idx).trim();
    const val = parseFloat(txt.substring(idx + 1).trim());
    if (isNaN(val)) return;

    if (key === "mode") {
        applyMode(val === 1);
        return;
    }
    if (key === "Relay") {
        updateRelayUI(val === 1);
        if (state.db) update(ref(state.db, `${state.path}/relay`), { value: val });
        return;
    }
    // Konversi key ultrasonic bawaan ('jarak') agar dibaca sebagai 'suhu' dht11
    if (key === "suhu" || key === "jarak") { 
        updateSensorUI(val);
        pushHistory(val);
        if (state.db) update(ref(state.db, `${state.path}/suhu`), { value: val, tipe: 'sensor', satuan: 'C' });
        return;
    }
}

async function sendBLE(key, val) {
    if (!state.rxChar) return;
    const payload = `${key},${val}\n`;
    try {
        await state.rxChar.writeValue(new TextEncoder().encode(payload));
        log(`TX → ${payload.trim()}`, "#ffd15c");
    } catch (e) { log(`Gagal Kirim Data: ${e.message}`, "#ff5252"); }
}

window.toggleRelay = (isChecked) => {
    if (state.modeOtomatis === 1) return;
    const val = isChecked ? 1 : 0;
    updateRelayUI(isChecked);
    sendBLE("Relay", val);
    if (state.db) update(ref(state.db, `${state.path}/relay`), { value: val });
    log(`Aksi Manual Kipas → ${isChecked ? 'ON' : 'OFF'}`, "#ff65a3");
};

// Firebase Cloud Synchronization System Core Backend
async function connectFirebase() {
    const apiKey = $('fb-apiKey').value.trim();
    const dbUrl  = $('fb-dbUrl').value.trim();
    const path   = $('fb-path').value.trim() || "smarthome/ruangan1";
    if (!apiKey || !dbUrl) { alert("Tolong lengkapi kolom API Key dan Database URL Firebase!"); return; }

    try {
        const apps = getApps();
        if (apps.length > 0) await deleteApp(apps[0]);
        if (state.unsub) state.unsub();

        const app = initializeApp({
            apiKey, databaseURL: dbUrl,
            projectId: dbUrl.replace("https://","").split(".")[0]
        });
        state.db   = getDatabase(app);
        state.path = path;
        log(`Menyambungkan Sesi Database... /${path}`, "#ffd15c");

        const initData = {
            suhu:  { tipe: 'sensor', value: 0, satuan: 'C' },
            relay: { tipe: 'switch', value: 0 },
            mode:  { tipe: 'switch', value: 1 }
        };

        state.unsub = onValue(ref(state.db, path), (snap) => {
            const d = snap.val();
            if (!d) { set(ref(state.db, path), initData); return; }
            state.data = d;
            updateDBStatus(true);

            if (d.suhu)  { updateSensorUI(d.suhu.value ?? 0); pushHistory(d.suhu.value ?? 0); }
            if (d.relay) updateRelayUI((d.relay.value ?? 0) === 1);
            if (d.mode)  applyMode((d.mode.value ?? 1) === 1);
        }, err => { log(`Firebase Error: ${err.message}`, "#ff5252"); updateDBStatus(false); });

        log(`✓ Sinkronisasi Cloud Firebase Berhasil!`, "#ff65a3");
        localStorage.setItem('pusheen_garden_cfg', JSON.stringify({ apiKey, dbUrl, path }));
    } catch (e) { log(`Koneksi DB Gagal: ${e.message}`, "#ff5252"); updateDBStatus(false); }
}

// ChartJS Realtime Generation Engine (Desain Chart Dipertahankan Asli)
function makeChart(canvasId, height = 70) {
    const canvas = $(canvasId);
    if (!canvas) return null;
    const ctx = canvas.getContext('2d');
    
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, 'rgba(255, 101, 163, 0.4)');
    grad.addColorStop(1, 'rgba(255, 101, 163, 0.0)');

    return new Chart(ctx, {
        type: 'line',
        data: {
            labels: state.history.suhu.labels,
            datasets: [{ 
                data: state.history.suhu.data, 
                borderColor: '#ff65a3', 
                backgroundColor: grad, 
                borderWidth: 3, 
                pointRadius: 0, 
                fill: true, 
                tension: 0.4 
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: true } },
            scales: { y: { display: true, grid: { display: false } }, x: { display: false } },
            animation: { duration: 150 }
        }
    });
}

function pushHistory(val) {
    const h = state.history.suhu;
    h.labels.push(new Date().toLocaleTimeString('id-ID', { hour12: false }));
    h.data.push(parseFloat(val) || 0);
    if (h.labels.length > MAX_PTS) { h.labels.shift(); h.data.shift(); }

    const ch = state.charts['chart-suhu-mini'];
    if (ch) {
        ch.data.labels = h.labels;
        ch.data.datasets[0].data = h.data;
        ch.update('none');
    }
}

// App Initialization Event Binding Entry Point
$('btn-connect-ble').onclick    = connectBLE;
$('btn-disconnect-ble').onclick = () => { if (state.device) state.device.gatt.disconnect(); };
$('btn-connect-fb').onclick     = connectFirebase;
$('btnClearLog').onclick        = () => $('terminalLog').innerHTML = '';

window.onload = () => {
    state.charts['chart-suhu-mini'] = makeChart('chart-suhu-mini', 70);
    applyMode(true);
    
    const saved = JSON.parse(localStorage.getItem('pusheen_garden_cfg') || '{}');
    if (saved.apiKey) {
        $('fb-apiKey').value = saved.apiKey;
        $('fb-dbUrl').value  = saved.dbUrl;
        $('fb-path').value   = saved.path || "smarthome/ruangan1";
    }
    log("Aplikasi Siap! Sambungkan Firebase & Micro:bit untuk memulai... 🌱", "#ff65a3");
};
</script>
